[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zyagent"
version = "0.1.0"
description = "A small, clean-architecture agent with safe tools, conversation branching, and context compression."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "zyagent contributors" }]
dependencies = []

[project.scripts]
zyagent = "zyagent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF"]
ignore = ["RUF012"]
